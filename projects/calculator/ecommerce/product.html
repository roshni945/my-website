<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Details | Roshni Store</title>


    <link rel="stylesheet" href="e-commerce.css">


    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">


</head>


<body>


    <!-- NAVBAR -->

    <header class="navbar">


        <div class="logo">

            🛒 Roshni Store

        </div>


        <nav>

            <a href="index.html">
                Home
            </a>


            <a href="cart.html">
                Cart
            </a>


        </nav>


    </header>





    <!-- PRODUCT DETAILS -->


    <section class="product-details">


        <div class="product-image">


            <img id="productImage" src="" alt="Product">


        </div>





        <div class="product-info">


            <h1 id="productName">

                Product Name

            </h1>


            <div class="rating">

                ⭐⭐⭐⭐⭐

            </div>



            <h2 id="productPrice">

                ₹0

            </h2>



            <p id="productDescription">

                Premium quality product with amazing features.

            </p>




            <div class="quantity">


                <label>

                    Quantity:

                </label>


                <input type="number" id="quantity" value="1" min="1">


            </div>





            <button id="addCartBtn">

                <i class="fa-solid fa-cart-shopping"></i>

                Add To Cart

            </button>



            <button class="buy-btn">

                Buy Now

            </button>



        </div>


    </section>





    <footer>


        <h2>

            🛒 Roshni Store

        </h2>


        <p>

            Premium Shopping Experience

        </p>


    </footer>





    <script src="product.js"></script>


</body>

</html>
